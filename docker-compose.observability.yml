services:
  prometheus:
    image: prom/prometheus:latest
    container_name: account-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./deploy/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    networks:
      - observability-net

  grafana:
    image: grafana/grafana-oss:latest
    container_name: account-grafana
    ports:
      - "3000:3000"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./deploy/grafana/provisioning/datasources/prometheus.yml:/etc/grafana/provisioning/datasources/prometheus.yml:ro
    depends_on:
      - prometheus
    networks:
      - observability-net

  seq:
    image: datalust/seq:latest
    container_name: dev-seq
    environment:
      ACCEPT_EULA: "Y"
      SEQ_FIRSTRUN_NOAUTHENTICATION: "true"
    ports:
      - "5341:5341"
      - "8081:80"
    volumes:
      - seq-data:/data
    networks:
      - observability-net

networks:
  observability-net:
    name: observability-net
    driver: bridge

volumes:
  prometheus-data:
  grafana-data:
  seq-data:

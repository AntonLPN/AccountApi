<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Email Verified - LPN Account API</title>
</head>
<body style="margin: 0; padding: 0; font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; background-color: #0A0A0A; color: #FFFFFF; text-align: center;">

<table role="presentation" cellspacing="0" cellpadding="0" border="0" width="100%" style="background-color: #0A0A0A; padding: 40px 10px;">
    <tr>
        <td align="center">

            <div style="background-color: #141414; padding: 50px 30px; border-radius: 20px; max-width: 450px; width: 100%; border: 1px solid #222222; box-shadow: 0 15px 35px rgba(0, 0, 0, 0.7); text-align: center; box-sizing: border-box;">

                <!-- Branding Header -->
                <div style="margin-bottom: 30px; font-size: 24px; font-weight: bold; color: #FFFFFF;">
                    LPN Account- <span style="color: #FF6B00; font-size: 32px; font-weight: 900; vertical-align: middle;">API</span>
                </div>

                <!-- Success Icon Badge -->
                <div style="margin-bottom: 25px;">
                    <div style="display: inline-block; width: 70px; height: 70px; line-height: 70px; background-color: rgba(0, 230, 118, 0.1); border: 2px solid #00E676; border-radius: 50%; color: #00E676; font-size: 36px;">
                        ✓
                    </div>
                </div>

                <h1 style="font-size: 24px; font-weight: 700; margin: 0 0 15px 0; color: #FFFFFF; letter-spacing: -0.5px;">
                    Email Verified Successfully!
                </h1>

                <p style="font-size: 16px; color: #B0B0B0; line-height: 1.6; margin: 0 0 25px 0;">
                    Your email address has been confirmed. Your <strong style="color: #FFFFFF;">LPN Account API</strong> account is now active and ready to use.
                </p>

                <!-- Call to Action Banner -->
                <p style="font-size: 14px; color: #B0B0B0; line-height: 1.6; margin: 25px 0 0 0; background-color: #1C1C1C; padding: 15px; border-radius: 10px; border-left: 3px solid #00E676; text-align: left;">
                    <strong style="color: #FFFFFF;">What's next?</strong> You can close this window and return to the application or log in to continue.
                </p>

                <!-- Footer -->
                <div style="margin-top: 35px; font-size: 13px; color: #555555; border-top: 1px solid #222222; padding-top: 25px; line-height: 1.5;">
                    Need assistance? <a href="https://github.com/AntonLPN/AccountApi" style="color: #FF6B00; text-decoration: none; font-weight: bold;">Contact Support</a>
                </div>

            </div>

        </td>
    </tr>
</table>

</body>
</html>

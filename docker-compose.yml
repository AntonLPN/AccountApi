services:
  # ---------------------------------------------------------------------------
  # Papercut (SMTP Dev Server)
  # UI: http://localhost:8082
  # ---------------------------------------------------------------------------
  papercut:
    image: rnwood/smtp4dev:latest
    container_name: dev-papercut
    ports:
      - "3025:25"
      - "8082:80"
    networks:
      - account-net
  # ---------------------------------------------------------------------------
  # Account API
  # ---------------------------------------------------------------------------
  api:
      build:
        context: .
        dockerfile: AccountApi/Dockerfile
      container_name: account-api
      environment:
        ASPNETCORE_ENVIRONMENT: Development
        ASPNETCORE_URLS: "http://+:8080"
        DbConfig__ConnectionString: "server=mysql;port=3306;user=root;password=123456;database=AccountDb;"
        Authentication__Schemes__Bearer__Authority: "http://keycloak:8080/realms/account-api"
        Authentication__Schemes__Bearer__MetadataAddress: "http://keycloak:8080/realms/account-api/.well-known/openid-configuration"
        Authentication__Schemes__Bearer__ValidAudience: "account-api"
        KeycloakAdminClient__BaseUrl: "http://keycloak:8080/"
        KeycloakAdminClient__Realm: "account-api"
        KeycloakAdminClient__ClientId: "account-api"
        KeycloakAdminClient__ClientSecret: "l3OVF0TX1w9VME5rFrlqlDayfCUMt8ZL"
        Messaging__UseRabbitMq: "true"
        Messaging__RabbitMq__Host: "rabbitmq"
        RABBITMQ_HOST: "rabbitmq"
        Messaging__Email__OwnerName: "Account API Local Dev"
        Messaging__Email__Email: "no-reply@account-api.local"
        Messaging__Email__HostName: "papercut"
        Messaging__Email__Port: "25"
        Messaging__Email__EnableSsl: "false"
        Redis__Host: "redis"
        Redis__Port: "6379"
        Redis__User: ""
        Redis__Password: ""
        Redis__Ssl: "false"
        Redis__CacheStorageTime: "30"
        # Отправка логов в общий Seq
        Seq__ServerUrl: "http://seq:5341"
      ports:
        - "5001:8080"
      volumes:
        - aspnet-data-protection-keys:/home/app/.aspnet/DataProtection-Keys
 
      networks:
        - account-net
        - observability-net # Shared network includes MySQL and observability services.
networks:
  account-net:
    driver: bridge
  observability-net:
    external: true
    name: observability-net
  
volumes:
    aspnet-data-protection-keys:
